; platformio.ini -- PlatformIO build of the D-Sentry RA4M1 sketch (the owner's VS Code workflow).
; It compiles exactly what arduino-cli compiles: dsentry/dsentry.ino and dsentry/src/, against the
; same core version (framework-arduinorenesas-uno 1.6.0 = arduino:renesas_uno 1.6.0) and the same
; library copies (the Arduino sketchbook's, pinned in libraries.txt). tools/build.sh checks both.
;
;   pio run -d D-SentryCode/firmware-ra4m1            build
;   pio run -d D-SentryCode/firmware-ra4m1 -t upload  flash over USB (on the bench only)
;
; No -I flags are needed: dsentry.ino includes "src/App.h" and every src file includes
; "../config.h", which resolves through the symlinks in dsentry/. If one is ever added, quote it:
; the repo path contains a space ("-I${PROJECT_DIR}/..", research-ra4m1-timers.md Q6).
;
; SPDX-License-Identifier: MIT

[platformio]
src_dir = dsentry
; Inside the gitignored build/ folder, never inside the sketch (arduino-cli would compile it).
build_dir = build/pio

[env:uno_r4_wifi]
platform = renesas-ra@1.9.0
board = uno_r4_wifi
framework = arduino
; PlatformIO turns dsentry.ino into dsentry.ino.cpp while it builds; src/ holds the modules
; (hal_arduino.cpp included: ARDUINO is defined here).
build_src_filter = +<*.ino.cpp> +<src/>
; No warning flags here: the renesas-ra framework script passes -w to every compile, which
; silences warnings whatever follows it. The warning gate is arduino-cli --warnings all in
; tools/build.sh, which must show none in D-Sentry code.
; The sketchbook's copies, the same ones arduino-cli uses (Adafruit NeoPixel 1.15.5,
; LiquidCrystal I2C 1.1.2). Found by include scanning: no lib_deps, so no registry access.
lib_extra_dirs = ${sysenv.HOME}/Documents/Arduino/libraries
monitor_speed = 115200
